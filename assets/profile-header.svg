<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Liang Chen — Builder and Operator</title>
  <desc id="desc">A dark personal profile banner for Liang Chen, co-founder and COO of SiliconProspect AI. An abstract neural network in lime and lavender accompanies the words Clarity, Trust, and Real-world impact.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="#b9a3ff" fill-opacity="0.13"/>
    </pattern>
    <linearGradient id="edge" x1="808" y1="75" x2="1120" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b9a3ff"/>
      <stop offset="1" stop-color="#c9ff69"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(980 210) rotate(90) scale(178 205)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b9a3ff" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#b9a3ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="420" rx="20" fill="#0b0d12"/>
  <rect x="1" y="1" width="1198" height="418" rx="19" stroke="#b9a3ff" stroke-opacity="0.14"/>
  <path d="M800 1H1180C1190.49 1 1199 9.51 1199 20V400C1199 410.49 1190.49 419 1180 419H800V1Z" fill="url(#grid)"/>
  <ellipse cx="980" cy="210" rx="205" ry="178" fill="url(#halo)"/>

  <g font-family="'Segoe UI', Arial, sans-serif">
    <circle cx="68" cy="55" r="4" fill="#c9ff69"/>
    <text x="84" y="60" fill="#c9ff69" font-size="12" font-weight="600" letter-spacing="1.6">SILICONPROSPECT AI</text>
    <text x="64" y="121" fill="#b9a3ff" font-size="17" font-weight="500" letter-spacing="2.2">BUILDER &amp; OPERATOR</text>
    <text x="58" y="226" fill="#f3f3f6" font-size="106" font-weight="800" letter-spacing="-5">LIANG CHEN</text>
    <text x="65" y="273" fill="#c9ff69" font-size="17" font-weight="600" letter-spacing="2.1">CLARITY. TRUST. REAL-WORLD IMPACT.</text>
    <text x="65" y="311" fill="#9598a6" font-size="14" letter-spacing="0.3">Co-founder &amp; COO · SiliconProspect AI</text>
  </g>

  <g stroke="url(#edge)" stroke-linecap="round" stroke-linejoin="round">
