    <path d="M924 154L1042 210L997 276L903 246Z" fill="#b9a3ff" fill-opacity="0.025" stroke-opacity="0.7"/>
    <path d="M836 138L903 246L997 276" stroke="#c9ff69" stroke-opacity="0.7"/>
    <circle cx="967" cy="210" r="104" stroke-opacity="0.08"/>
    <circle cx="967" cy="210" r="158" stroke-opacity="0.06" stroke-dasharray="2 10"/>
